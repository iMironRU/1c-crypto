# ─────────────────────────────────────────────
#  ИДЕНТИФИКАЦИЯ КНИГИ
# ─────────────────────────────────────────────
title: "Криптография в 1С"
subtitle: "Мини-курс для разработчиков"
author: "Мирошниченко Александр (aka iMiron)"
author_url: "https://github.com/iMironRU"
language: ru                  # ru | en
license: "CC BY 4.0"

# Версия книги (SemVer: MAJOR.MINOR.PATCH)
# MAJOR — структурная реорганизация, смена концепции
# MINOR — новые главы или значительная переработка
# PATCH — исправления, уточнения, опечатки
version: "1.0.0"

# Стабильный слаг книги для BSLexicon
book_id: "1c-crypto"

# ─────────────────────────────────────────────
#  ОТСЛЕЖИВАНИЕ ШАБЛОНА
# ─────────────────────────────────────────────
template_repo: "https://github.com/iMironRU/book-template"
template_version: "v0.2.1"

# ─────────────────────────────────────────────
#  ФОРМАТЫ ВЫПУСКА
# ─────────────────────────────────────────────
formats:
  epub:       true    # EPUB для читалок
  fb2:        true    # FB2 для читалок
  pdf_a5:     true    # PDF формат A5 (основной для чтения)
  pdf_a4:     false   # PDF формат A4 (для печати)
  html:       true    # HTML — один самодостаточный файл
  docx:       true    # DOCX стандарт
  docx_a4:    false   # DOCX A4 с полями под печать
  site:       true    # Сайт на GitHub Pages (mdBook)

# Фильтр статуса для сборки:
#   ready   — только главы со статусом ready
#   review  — ready + review
#   all     — все главы, черновики помечаются баннером
release_filter: "review"
nightly_filter: "all"

# ─────────────────────────────────────────────
#  ДОПОЛНИТЕЛЬНЫЕ АРТЕФАКТЫ В РЕЛИЗ
# ─────────────────────────────────────────────
artifacts:
  - type: zip
    source: "code/"
    name: "code-examples"
# - type: zip
#   source: "code/"
#   name: "code-examples"
# - type: file
#   source: "configuration/releases/book.cf"
#   name: "demo"

# ─────────────────────────────────────────────
#  САЙТ (GitHub Pages)
# ─────────────────────────────────────────────
site_url: "https://imiron.ru/1c-crypto/"

# ─────────────────────────────────────────────
#  НОЧНЫЕ СБОРКИ
# ─────────────────────────────────────────────
nightly:
  enabled: true
  branch: "main"

# ─────────────────────────────────────────────
#  PDF — ПАРАМЕТРЫ СТРАНИЦЫ
# ─────────────────────────────────────────────
pdf:
  font_main: "PT Serif"
  font_mono: "JetBrains Mono"
  font_size: "11pt"
  margin_a5: "top=20mm,right=15mm,bottom=20mm,left=20mm"
  margin_a4: "top=25mm,right=20mm,bottom=25mm,left=25mm"

# ─────────────────────────────────────────────
#  НАЗВАНИЯ УРОКОВ (заголовки разделов в SUMMARY)
# ─────────────────────────────────────────────
modules:
  01_zachem-nuzhna-kriptografiya: "Урок 1. Зачем это нужно разработчику 1С"
  02_heshirovanie: "Урок 2. Хеширование: необратимый отпечаток"
  03_hranenie-parolej: "Урок 3. Хранение паролей: почему не шифрование"
  04_klyuchi-sertifikaty-provajdery: "Урок 4. Ключи, сертификаты, криптопровайдеры"
  05_shifrovanie: "Урок 5. Шифрование: сейф для данных"
  06_elektronnaya-podpis: "Урок 6. Электронная подпись: цифровая печать"
  07_realnye-zadachi: "Урок 7. Криптография в реальных задачах"
  08_diagnostika: "Урок 8. Диагностика: когда что-то пошло не так"
